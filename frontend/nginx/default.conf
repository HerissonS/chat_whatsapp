# Central de Atendimento - frontend (SPA) e proxy para a API.
# Só /api/ e /socket.io/ chegam ao backend. O webhook da Evolution (/webhook/) NÃO é exposto aqui.

# Limites de requisições por IP (proteção contra força bruta e abuso).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # DNS interno do Docker: resolve o backend a cada 30 s (sobrevive a reinícios do container).
    # Usa o nome do SERVIÇO do compose ("backend"), que não muda quando o container_name é trocado.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:3000;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        # Uploads de mídia. O backend aplica o limite real (MEDIA_MAX_MB).
        client_max_body_size 110m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Arquivos ocultos (.env, .git etc.) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    # SPA: qualquer outra rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
